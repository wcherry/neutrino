name: 📚 Documentation
description: Something is missing, incorrect, or unclear in the docs.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Which documentation?
      multiple: true
      options:
        - Installation
        - Docker deployment
        - Configuration
        - API reference
        - Development setup
        - Contributing guide
        - Encryption
        - Backup and recovery
        - In-app help / UI copy
        - README
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where is it?
      description: File path, URL, or the page/section name.
      placeholder: "README.md#installation, or agent_docs/performance-testing.md"

  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: If you know what it should say, write it here — we'll happily take the wording.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a PR for this.
