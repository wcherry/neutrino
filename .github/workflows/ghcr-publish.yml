name: Build and Publish Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  # Major and minor for the version the UI reports; the patch is the run number
  # offset by BASE_NUMBER, so every published image gets its own patch without
  # anything being committed back, and the count restarts near zero for each
  # minor rather than carrying the whole repo's build history forward.
  # Bump both by hand when a release calls for it: BASE_NUMBER is the run number
  # of the last build on the *previous* minor.
  BASE_VERSION: "0.2"
  BASE_NUMBER: 125

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolved once so the image tag and the version stamped into
      # `web/version.txt` are the same string.
      - name: Resolve app version
        id: version
        run: echo "version=${BASE_VERSION}.$(( GITHUB_RUN_NUMBER - BASE_NUMBER ))" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/neutrino
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
